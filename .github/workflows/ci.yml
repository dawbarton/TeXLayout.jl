name: Run tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['lts', '1']
        julia-arch: [x64]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
        with:
          annotate: true
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Makie 0.25 is unreleased: run the suite, including the TeXLayoutHandler
  # assertions, against its development branch.  Experimental, so a failure
  # here (for example after a breaking change upstream) does not fail the run.
  makie-0-25:
    name: Makie 0.25 (ff/breaking-0.25, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MakieOrg/Makie.jl
          ref: ff/breaking-0.25
          path: makie-src
          sparse-checkout: |
            ComputePipeline
            Makie
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3
        with:
          version: '1'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Develop the Makie branch and TeXLayout into a scratch environment
        run: |
          julia --project=makie-env -e '
            using Pkg
            Pkg.develop([
                PackageSpec(path = "makie-src/ComputePipeline"),
                PackageSpec(path = "makie-src/Makie"),
                PackageSpec(path = pwd()),
            ])
            Pkg.instantiate()'
      - name: Run the tests with that Makie
        run: julia --project=makie-env -e 'using Pkg; Pkg.test("TeXLayout")'
